# fcc_id_lookup Finalize Baseline
#
# Runs entirely inside GitHub's own Windows Actions environment specifically
# to work around two limitations of this project's AI cloud sandbox
# (documented in docs/KNOWN_ISSUES.md item 5 and re-confirmed throughout
# every prior phase's own PHASEX_3 finalization work):
#   1. The sandbox cannot download GitHub Actions artifacts - they always
#      redirect to Azure Blob Storage, which the sandbox's network policy
#      blocks (confirmed 403).
#   2. The sandbox's own git relay has historically returned 403 on tag
#      pushes specifically, even though ordinary branch pushes through the
#      same relay work fine.
#
# A GitHub-hosted runner has neither problem: it can download its own prior
# run's artifacts directly via `gh run download`, and it pushes using the
# workflow's own GITHUB_TOKEN, which has real push (including tag) access
# to this repository. This workflow downloads the artifacts from an
# already-successful "fcc_id_lookup One-App Import Validation" run, computes
# real SHA-256 hashes of the actual files (never fabricated), commits the
# resulting hash manifest to docs/, and creates the two immutable baseline
# tags - the exact same mechanism
# phase2a/phase2b/phase2c/phase2d/phase2e/phase2f-finalize-baseline.yml
# already used successfully, adapted for the dedicated fcc_id_lookup
# one-app import, not a new design.
#
# Scope, deliberately narrow: this workflow touches docs/ only (plus the two
# tags). It never imports apps, never modifies firmware/app source, never
# flashes hardware, never invokes -Mode HardwareAssisted (there is no such
# invocation anywhere in this file), never publishes a GitHub Release, and
# never commits firmware.dfu/the updater .tgz/any other binary or database
# file - only their hashes, as text, in docs/FCC_ID_LOOKUP_ARTIFACT_HASHES.md.
#
# Manually triggered only (workflow_dispatch) - this is a one-time
# finalization action for a specific already-accepted baseline, not a
# routine CI job that should run on every push.
#
# The accepted source run defaults to the later, automatically-triggered CI
# run found at the true current branch HEAD at finalization-preparation
# time (checked explicitly before finalizing, per this phase's own
# requirement, so the tagged commit and its hashed artifacts are the exact
# same state, with no gap between them) - not the earlier run originally
# cited before that check was performed.
#
# All GitHub Actions expression values (${{ ... }}) are passed into steps via
# `env:` and read back as $env:NAME inside PowerShell, rather than spliced
# directly into script bodies - this avoids quoting/escaping hazards where a
# context value could land inside a string literal unexpectedly. Multi-line
# Markdown content is built as PowerShell arrays of single-line strings
# joined with "`n" (not here-strings): a here-string's closing delimiter
# must sit at true column 0 in PowerShell 7, which is incompatible with a
# script that is itself indented as a YAML block-literal `run:` value.

name: fcc_id_lookup Finalize Baseline

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID of the already-successful 'fcc_id_lookup One-App Import Validation' run to pull artifacts from"
        required: true
        default: "29068148596"
      ci_baseline_sha:
        description: "Commit SHA the CI baseline tag should point at"
        required: true
        default: "86265727b5b8cfce5086eb88f8bb93d0169ab9a9"
      acceptance_tag_name:
        description: "Name for the acceptance-record tag"
        required: true
        default: "fcc-id-lookup-acceptance-record-20260710"
      ci_tag_name:
        description: "Name for the CI-baseline tag"
        required: true
        default: "fcc-id-lookup-ci-baseline-20260710"
      target_branch:
        description: "Branch to check out, commit docs to, and push"
        required: true
        default: "integration/fcc-id-lookup-one-app-import"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  SOURCE_RUN_ID: ${{ inputs.source_run_id }}
  CI_BASELINE_SHA: ${{ inputs.ci_baseline_sha }}
  ACCEPTANCE_TAG_NAME: ${{ inputs.acceptance_tag_name }}
  CI_TAG_NAME: ${{ inputs.ci_tag_name }}
  TARGET_BRANCH: ${{ inputs.target_branch }}
  REPO: ${{ github.repository }}
  THIS_RUN_ID: ${{ github.run_id }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  finalize:
    name: Finalize artifact hashes and baseline tags (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout target branch (full history)
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
          clean: "true"
          persist-credentials: true

      - name: Verify branch, commit, and required files
        shell: pwsh
        run: |
          $branch = git rev-parse --abbrev-ref HEAD
          $commit = git rev-parse HEAD
          Write-Host "Branch: $branch"
          Write-Host "Commit: $commit"
          if ($branch -ne $env:TARGET_BRANCH) {
            Write-Error "Checked out branch '$branch' does not match requested target_branch '$env:TARGET_BRANCH'."
            exit 1
          }
          foreach ($f in @(
            'docs\FCC_ID_LOOKUP_ARTIFACT_MANIFEST.md',
            'docs\FCC_ID_LOOKUP_BASELINE_ACCEPTANCE_RECORD.md',
            'docs\FCC_ID_LOOKUP_ARTIFACT_HASHES.md'
          )) {
            if (-not (Test-Path $f)) {
              Write-Error "Required file '$f' not found - is this the wrong branch/checkout?"
              exit 1
            }
          }
          git status --short

      - name: Download source run artifacts
        shell: pwsh
        run: |
          $dir = ".\reports\fcc_id_lookup_finalize_artifacts"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          gh run download $env:SOURCE_RUN_ID --repo $env:REPO --dir $dir
          if ($LASTEXITCODE -ne 0) {
            Write-Error "gh run download failed for run $env:SOURCE_RUN_ID - it may have expired (workflow artifacts are retained 90 days) or the run ID may be wrong."
            exit 1
          }
          Get-ChildItem -Path $dir -Recurse -File | ForEach-Object { Write-Host $_.FullName }

      - name: Compute real SHA-256 hashes and generate hash manifest
        id: hashes
        shell: pwsh
        run: |
          $dir = ".\reports\fcc_id_lookup_finalize_artifacts"
          $allFiles = Get-ChildItem -Path $dir -Recurse -File

          $firmware = $allFiles | Where-Object { $_.Name -eq 'firmware.dfu' } | Select-Object -First 1
          $updater = $allFiles | Where-Object { $_.Name -eq 'flipper-z-f7-update-local.tgz' } | Select-Object -First 1
          $reports = $allFiles | Where-Object { $_.Extension -in @('.json', '.md') -and $_.Name -like 'phase2a_validation_*' }
          $logs = $allFiles | Where-Object { $_.Extension -eq '.log' }
          $faps = $allFiles | Where-Object { $_.Extension -eq '.fap' }

          if (-not $firmware) { Write-Error "firmware.dfu not found among downloaded artifacts."; exit 1 }
          if (-not $updater) { Write-Error "flipper-z-f7-update-local.tgz not found among downloaded artifacts."; exit 1 }

          $firmwareHash = (Get-FileHash -Path $firmware.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $updaterHash = (Get-FileHash -Path $updater.FullName -Algorithm SHA256).Hash.ToLowerInvariant()

          Write-Host "firmware.dfu: $($firmware.Length) bytes, sha256=$firmwareHash"
          Write-Host "updater .tgz: $($updater.Length) bytes, sha256=$updaterHash"

          $fapCheck = $faps | Where-Object { $_.Name -eq 'fcc_id_lookup.fap' } | Select-Object -First 1
          if (-not $fapCheck) {
            Write-Error "fcc_id_lookup.fap not found among downloaded .fap artifacts - refusing to finalize a baseline that cannot confirm the imported app's own build output."
            exit 1
          }
          Write-Host "fcc_id_lookup.fap confirmed present: $($fapCheck.Length) bytes"

          $reportRows = New-Object System.Collections.Generic.List[string]
          foreach ($r in ($reports | Sort-Object Name)) {
            $h = (Get-FileHash -Path $r.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $reportRows.Add("| ``$($r.Name)`` | $($r.Length.ToString('N0')) | ``$h`` |")
          }
          foreach ($l in ($logs | Sort-Object Name)) {
            $h = (Get-FileHash -Path $l.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $reportRows.Add("| ``$($l.Name)`` (build log) | $($l.Length.ToString('N0')) | ``$h`` |")
          }
          $reportTable = $reportRows -join "`n"
          if (-not $reportTable) { $reportTable = "| _(no validation report/log files found in the downloaded artifact)_ | | |" }

          $fapRows = New-Object System.Collections.Generic.List[string]
          foreach ($fap in ($faps | Sort-Object Name)) {
            $h = (Get-FileHash -Path $fap.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $fapRows.Add("| ``$($fap.Name)`` | $($fap.Length.ToString('N0')) | ``$h`` |")
          }
          $fapTable = $fapRows -join "`n"
          if (-not $fapTable) { $fapTable = "| _(no .fap files found in the downloaded artifact)_ | | |" }
          Write-Host "Found $($faps.Count) .fap files"

          $runUrl = "https://github.com/$env:REPO/actions/runs/$env:SOURCE_RUN_ID"
          $finalizedByUrl = "https://github.com/$env:REPO/actions/runs/$env:THIS_RUN_ID"

          # Built as an array of lines joined by newline, not a here-string -
          # see the file-header comment for why. Modeled directly on
          # phase2a-phase2f-finalize-baseline.yml's already-proven
          # equivalent step.
          $contentLines = @(
            "# fcc_id_lookup - Local Artifact Hash Manifest"
            ""
            "**Status: GENERATED.** Real, independently-computed SHA-256 hashes of the"
            "actual fcc_id_lookup baseline CI artifacts, generated by the GitHub Actions"
            """fcc_id_lookup Finalize Baseline"" workflow running on a real GitHub-hosted"
            "``windows-latest`` runner - not fabricated, not copied from any archive-level"
            "digest."
            ""
            "## Source"
            ""
            "| Field | Value |"
            "|---|---|"
            "| Source CI run ID | ``$env:SOURCE_RUN_ID`` |"
            "| Source CI run URL | $runUrl |"
            "| CI baseline commit (SHA) | ``$env:CI_BASELINE_SHA`` |"
            "| Hashes generated by | ""fcc_id_lookup Finalize Baseline"" workflow run [``$env:THIS_RUN_ID``]($finalizedByUrl) |"
            ""
            "## Firmware and updater artifacts"
            ""
            "| File | Size (bytes) | SHA-256 |"
            "|---|---|---|"
            "| ``firmware.dfu`` | $($firmware.Length.ToString('N0')) | ``$firmwareHash`` |"
            "| ``flipper-z-f7-update-local.tgz`` | $($updater.Length.ToString('N0')) | ``$updaterHash`` |"
            ""
            "## Validation reports and build logs"
            ""
            "| File | Size (bytes) | SHA-256 |"
            "|---|---|---|"
            "$reportTable"
            ""
            "## .fap artifact bundle ($($faps.Count) files)"
            ""
            "| File | Size (bytes) | SHA-256 |"
            "|---|---|---|"
            "$fapTable"
            ""
            "## What this does and does not mean"
            ""
            "- **These are real hashes of the actual downloaded files**, computed with"
            "  PowerShell's ``Get-FileHash -Algorithm SHA256`` on a GitHub-hosted Windows"
            "  runner that downloaded them directly from the source CI run via"
            "  ``gh run download``."
            "- **No binary is committed to this repository.** ``firmware.dfu``, the"
            "  updater ``.tgz``, and every ``.fap`` file exist only as GitHub Actions"
            "  workflow artifacts on the source run; only their hashes (text) are"
            "  committed here."
            "- **No FCC frequency/applicant database file is bundled, generated, or"
            "  hashed by this workflow** - fcc_id_lookup never bundles that database;"
            "  this remains unchanged by finalization."
            "- **Hardware-assisted validation: NOT RUN. Hardware flashing/testing: NOT"
            "  PERFORMED.**"
            "- **Release status: TEST-READY ONLY / NOT RELEASE-READY.** Generating these"
            "  hashes does not change either of those."
          )

          ($contentLines -join "`n") | Set-Content -Path docs\FCC_ID_LOOKUP_ARTIFACT_HASHES.md -Encoding utf8
          Write-Host "Wrote docs\FCC_ID_LOOKUP_ARTIFACT_HASHES.md"

          "firmware_hash=$firmwareHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "updater_hash=$updaterHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "firmware_size=$($firmware.Length)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "updater_size=$($updater.Length)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Patch the dependent docs to mark hashes finalized
        shell: pwsh
        run: |
          $runUrl = "https://github.com/$env:REPO/actions/runs/$env:THIS_RUN_ID"

          function Set-ExactReplacement {
            param([string]$Path, [string]$Old, [string]$New)
            $text = Get-Content -Path $Path -Raw
            if ($text.Contains($Old)) {
              $text = $text.Replace($Old, $New)
              $text | Set-Content -Path $Path -Encoding utf8 -NoNewline
              Write-Host "Patched $Path"
              return $true
            }
            Write-Warning "Expected sentinel text not found in $Path - leaving it unmodified. docs/FCC_ID_LOOKUP_ARTIFACT_HASHES.md still reflects the finalized state regardless."
            return $false
          }

          # Every -Old/-New value below is a single physical line (verified
          # against the actual doc files) written as a single-line string -
          # no here-strings, for the same reason noted in the file header.
          $oldAcceptance = '| Artifact hashes generated | **PENDING** — will be generated by the `fcc_id_lookup Finalize Baseline` GitHub Actions workflow once dispatched. See `docs/FCC_ID_LOOKUP_ARTIFACT_HASHES.md`. This section will be patched (not silently rewritten) once real hashes exist. |'
          $newAcceptance = "| Artifact hashes generated | **YES** — generated by the ``fcc_id_lookup Finalize Baseline`` GitHub Actions workflow, run [``$env:THIS_RUN_ID``]($runUrl). See ``docs/FCC_ID_LOOKUP_ARTIFACT_HASHES.md``. |"
          Set-ExactReplacement -Path 'docs\FCC_ID_LOOKUP_BASELINE_ACCEPTANCE_RECORD.md' -Old $oldAcceptance -New $newAcceptance | Out-Null

          $oldManifest = '**PENDING.** Real, independently-computed SHA-256 hashes of the actual'
          $newManifest = "**Finalized.** Real, independently-computed SHA-256 hashes of the actual"
          Set-ExactReplacement -Path 'docs\FCC_ID_LOOKUP_ARTIFACT_MANIFEST.md' -Old $oldManifest -New $newManifest | Out-Null

          git status --short

      - name: Commit docs changes only
        id: commit
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- docs/FCC_ID_LOOKUP_ARTIFACT_HASHES.md docs/FCC_ID_LOOKUP_ARTIFACT_MANIFEST.md docs/FCC_ID_LOOKUP_BASELINE_ACCEPTANCE_RECORD.md

          git status --short

          $staged = git diff --cached --name-only
          if (-not $staged) {
            Write-Host "Nothing staged - docs already reflect the finalized state. Skipping commit."
            "made_commit=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          else {
            $outsideDocs = $staged | Where-Object { -not $_.StartsWith('docs/') }
            if ($outsideDocs) {
              Write-Error "Refusing to commit: staged changes include files outside docs/: $($outsideDocs -join ', ')"
              exit 1
            }
            git commit -m "docs: finalize fcc_id_lookup artifact hashes from CI artifacts"
            "made_commit=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Push docs commit
        if: steps.commit.outputs.made_commit == 'true'
        shell: pwsh
        run: git push origin "HEAD:$env:TARGET_BRANCH"

      - name: Create or verify CI baseline tag
        shell: pwsh
        run: |
          git fetch origin "refs/tags/${env:CI_TAG_NAME}:refs/tags/${env:CI_TAG_NAME}" 2>$null
          $existing = git rev-list -n 1 $env:CI_TAG_NAME 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            if ($existing -eq $env:CI_BASELINE_SHA) {
              Write-Host "Tag $env:CI_TAG_NAME already exists and points at the correct commit ($existing). Leaving unchanged."
            }
            else {
              Write-Error "Tag $env:CI_TAG_NAME already exists but points at $existing, not the expected $env:CI_BASELINE_SHA. Refusing to overwrite - resolve manually."
              exit 1
            }
          }
          else {
            git tag -a $env:CI_TAG_NAME $env:CI_BASELINE_SHA -m "fcc_id_lookup CI baseline: Windows validation pass with reviewed false positives, run $env:SOURCE_RUN_ID. Dedicated one-app import of fcc_id_lookup on top of the accepted 19-app Phase 2A-2F baseline (20 apps total). Hardware not tested. Not release-ready."
            git push origin "refs/tags/$env:CI_TAG_NAME"
            Write-Host "Created and pushed tag $env:CI_TAG_NAME -> $env:CI_BASELINE_SHA"
          }

      - name: Create or verify acceptance-record tag
        shell: pwsh
        run: |
          $headSha = git rev-parse HEAD
          git fetch origin "refs/tags/${env:ACCEPTANCE_TAG_NAME}:refs/tags/${env:ACCEPTANCE_TAG_NAME}" 2>$null
          $existing = git rev-list -n 1 $env:ACCEPTANCE_TAG_NAME 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            if ($existing -eq $headSha) {
              Write-Host "Tag $env:ACCEPTANCE_TAG_NAME already exists and points at the correct commit ($existing). Leaving unchanged."
            }
            else {
              Write-Error "Tag $env:ACCEPTANCE_TAG_NAME already exists but points at $existing, not this run's finalization commit ($headSha). Refusing to overwrite - resolve manually (delete and recreate deliberately if a re-point is truly intended)."
              exit 1
            }
          }
          else {
            git tag -a $env:ACCEPTANCE_TAG_NAME $headSha -m "fcc_id_lookup acceptance record: non-hardware CI baseline accepted for the dedicated one-app import (20 apps total: 19 already-accepted Phase 2A-2F apps + fcc_id_lookup), artifact hashes finalized by GitHub Actions. Hardware not tested. Not release-ready."
            git push origin "refs/tags/$env:ACCEPTANCE_TAG_NAME"
            Write-Host "Created and pushed tag $env:ACCEPTANCE_TAG_NAME -> $headSha"
          }

      - name: Upload finalization docs as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcc-id-lookup-finalization-docs
          path: |
            docs/FCC_ID_LOOKUP_ARTIFACT_HASHES.md
          if-no-files-found: warn
          retention-days: 90

      - name: Status summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "Hardware-assisted validation: NOT RUN."
          Write-Host "Hardware flashing/testing: NOT PERFORMED."
          Write-Host "Release status: TEST-READY ONLY / NOT RELEASE-READY."
