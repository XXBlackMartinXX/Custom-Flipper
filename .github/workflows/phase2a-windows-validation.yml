# Phase 2A Windows Validation
#
# Runs the Phase 2A validation tooling (tools/phase2a_validate.ps1) on a real
# GitHub-hosted Windows runner, in Static then Build mode. This exists because
# the project owner does not currently have Claude Desktop or local Claude
# Code available to drive a real Windows build machine themselves — this
# workflow is the replacement path for getting a genuine Windows-machine
# result, instead of the cloud sandbox's own execution (which cannot run
# fbt.cmd at all - see docs/PHASE2A_AUTOMATED_VALIDATION_RESULTS.md).
#
# Scope, deliberately: Static + Build validation only, for the 5 Phase 2A
# apps already imported on this branch (network_subnet, programmer_calc,
# vin_decoder, flipper95, chess). This workflow NEVER runs
# `-Mode HardwareAssisted` - there is no physical Flipper Zero attached to a
# GitHub-hosted runner, hardware-assisted validation is out of scope for CI
# by construction, and nothing in this workflow flashes, claims to flash, or
# otherwise interacts with real hardware. See
# docs/PHASE2A_GITHUB_ACTIONS_VALIDATION.md for the full explanation of what
# this workflow does and does not prove.
#
# Reports and build artifacts are uploaded as workflow artifacts only - this
# workflow never commits anything back to the repository.

name: Phase 2A Windows Validation

on:
  workflow_dispatch: # manual "Run workflow" button, any branch
  push:
    branches: [integration/phase2a-first-batch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  # Same reasoning as pr-build.yml: pin submodule fetch to shallow to keep the
  # checkout fast; the Phase 2A validator's own submodule check only needs
  # each submodule pinned at the correct commit, not its full history.
  FBT_GIT_SUBMODULE_SHALLOW: 1

jobs:
  validate:
    name: Static + Build validation (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout (recursive submodules, full history)
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          clean: "true"

      - name: Show branch and commit under test
        shell: pwsh
        run: |
          Write-Host "Ref: $env:GITHUB_REF"
          Write-Host "SHA: $env:GITHUB_SHA"
          git rev-parse --abbrev-ref HEAD
          git rev-parse HEAD
          git status --short
          if (-not (Test-Path '.\tools\phase2a_validate.ps1')) {
            Write-Error "tools\phase2a_validate.ps1 not found - is this the wrong branch/checkout?"
            exit 1
          }
          if (-not (Test-Path '.\tools\phase2a_validate_config.json')) {
            Write-Error "tools\phase2a_validate_config.json not found - is this the wrong branch/checkout?"
            exit 1
          }

      # Defensive: GitHub's windows-latest images ship Python already, but
      # fbt.cmd's own toolchain bootstrap depends on a working `python` on
      # PATH, and image contents change over time - pin one explicitly rather
      # than relying on whatever happens to be first on PATH.
      - name: Ensure Python is available
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run Static validation
        id: static
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\tools\phase2a_validate.ps1 `
            -Mode Static `
            -ExpectedCommit $env:GITHUB_SHA `
            -ReportDir .\reports\phase2a
          exit $LASTEXITCODE

      - name: Run Build validation
        id: build
        if: always() && steps.static.outcome != 'cancelled'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\tools\phase2a_validate.ps1 `
            -Mode Build `
            -ExpectedCommit $env:GITHUB_SHA `
            -ReportDir .\reports\phase2a
          exit $LASTEXITCODE

      - name: Show git status after validation runs
        if: always()
        shell: pwsh
        run: git status --short

      # Uploaded regardless of PASS/FAIL/BLOCKED so a failing run is still
      # diagnosable from the Actions UI - never faked, never suppressed.
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2a-validation-reports
          path: reports/phase2a/**
          if-no-files-found: warn
          retention-days: 90

      # Build artifacts only - never the toolchain directory, never anything
      # under build/ or dist/ other than the two named files. Not committed
      # to the repository at any point; workflow-artifact only.
      - name: Upload firmware + updater artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2a-firmware-artifacts
          path: |
            build/f7-firmware-C/firmware.dfu
            dist/f7-C/flipper-z-f7-update-local.tgz
          if-no-files-found: warn
          retention-days: 90

      - name: Hardware-assisted validation status
        if: always()
        shell: pwsh
        run: |
          Write-Host "Hardware-assisted validation: NOT RUN. This workflow never invokes -Mode HardwareAssisted - there is no physical Flipper Zero attached to a GitHub-hosted runner, and hardware testing is out of scope for CI by design."
          Write-Host "Hardware flashing/testing: NOT PERFORMED."
          Write-Host "Release status: TEST-READY ONLY / NOT RELEASE-READY."
